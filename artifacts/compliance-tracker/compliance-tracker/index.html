    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Program Quality Manager?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Program Quality Manager is a free staff certification tracker built for Texas childcare programs. It tracks staff CPR, First Aid, and CDA certifications, annual training hours, pre-service hours, and Texas Rising Star progress for childcare centers (TAC 746), licensed home-based daycares (TAC 747), and school-age programs (TAC 744)."
          }
        },
        {
          "@type": "Question",
          "name": "Is it really free? What are the limits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, the free tier is completely free with no credit card required. It supports up to 12 staff members and 2 locations, includes certification tracking, training hour monitoring, Texas Rising Star progress, and CSV export."
          }
        },
        {
          "@type": "Question",
          "name": "Which TAC chapters does it support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Program Quality Manager supports all three Texas childcare licensing chapters: TAC 746 for licensed child care centers, TAC 747 for licensed home-based daycares, and TAC 744 for school-age programs and before/after school care. Each program type shows the correct annual training hour requirements and staff roles."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Texas Rising Star (TRS) tracker work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Rising Star section calculates your current TRS star level based on staff CPR certification coverage, First Aid certification coverage, and CDA credential ratios. It shows your current score, what level you are at, and exactly how many more points you need to reach the next star level."
          }
        },
        {
          "@type": "Question",
          "name": "What certifications does it track?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Program Quality Manager tracks CPR certification, First Aid certification, CDA (Child Development Associate) credentials, and custom certification types. It displays expiration dates and sends 30-day advance warnings so you are never caught off guard during a DFPS licensing inspection."
          }
        },
        {
          "@type": "Question",
          "name": "Can I manage multiple childcare locations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The free tier supports up to 2 locations, each with its own program type (child care center, licensed home, or school-age). Each location can have its own staff, certifications, and training records. Pro plans support unlimited locations."
          }
        },
        {
          "@type": "Question",
          "name": "How are training hours tracked?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For each staff member you can log annual training hours and pre-service hours. The app shows a progress bar toward the required hours for their role and program type — for example, a Director at a TAC 746 Child Care Center needs 30 annual hours and 24 pre-service hours."
          }
        }
      ]
    }
    </script>
